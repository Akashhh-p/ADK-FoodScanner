# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the file path indicated by -Pgradle_user_home on the command line.

# For more details on how to configure your build environment visit
# http://www.gradle.org/configure-maven-gradle-and-other-build-tools/gradle-build-environment-settings

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also http://gradle.org/docs/current/userguide/build_environment.html
# org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://gradle.org/configure-maven-gradle-and-other-build-tools/gradle-build-environment-settings
# org.gradle.parallel=true

# AndroidX package structure to make it easier to discover and migrate existing, old-style packages
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable the new kotlin incremental compilation
kotlin.incremental=true

# Gradle daemon memory
org.gradle.jvmargs=-Xmx2048m
